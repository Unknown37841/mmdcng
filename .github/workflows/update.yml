name: Update Subscription

on:
  schedule:
    - cron: "*/30 * * * *"  # هر ۳۰ دقیقه یک‌بار (وقت UTC)
  workflow_dispatch: {}      # اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run checker
        run: python check_and_build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_sub.txt report.txt
          git diff --staged --quiet || git commit -m "Update subscription $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
